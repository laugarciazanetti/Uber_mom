<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uber Parents</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-yellow {
      0%, 100% { background-color: #fef08a; border-color: #eab308; }
      50% { background-color: #fef9c3; border-color: #facc15; }
    }
    .time-changed-alert {
      animation: pulse-yellow 1.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-10">

  <!-- Header / Selector de Rol -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-car-side text-2xl text-yellow-300"></i>
        <h1 class="text-xl font-bold tracking-wide">Uber Parents</h1>
      </div>
      <div class="bg-indigo-700 p-1 rounded-lg flex text-xs font-semibold">
        <button id="btn-role-kid" onclick="setRole('kid')" class="px-3 py-1 rounded-md bg-white text-indigo-700 shadow">Hijos</button>
        <button id="btn-role-mom" onclick="setRole('mom')" class="px-3 py-1 rounded-md text-indigo-100 hover:text-white">Choferes</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4">

    <!-- VISTA HIJOS -->
    <section id="view-kid" class="space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-user-graduate text-indigo-500"></i> ¿Quién pide el viaje?
        </h2>
        <div class="grid grid-cols-2 gap-2 mb-4">
          <button type="button" onclick="selectKid('Felipe')" class="kid-btn p-2.5 text-sm border rounded-xl font-semibold border-slate-200 text-slate-700 hover:bg-indigo-50">Felipe</button>
          <button type="button" onclick="selectKid('Guille')" class="kid-btn p-2.5 text-sm border rounded-xl font-semibold border-slate-200 text-slate-700 hover:bg-indigo-50">Guille</button>
          <button type="button" onclick="selectKid('Juen')" class="kid-btn p-2.5 text-sm border rounded-xl font-semibold border-slate-200 text-slate-700 hover:bg-indigo-50">Juen</button>
          <button type="button" onclick="selectKid('Enri')" class="kid-btn p-2.5 text-sm border rounded-xl font-semibold border-slate-200 text-slate-700 hover:bg-indigo-50">Enri</button>
        </div>

        <h2 class="text-lg font-bold text-slate-700 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-rose-500"></i> ¿Dónde te buscamos?
        </h2>
        <div class="grid grid-cols-2 gap-2 mb-4">
          <button type="button" onclick="selectPlace('Colegio')" class="place-btn p-3 border rounded-xl text-left font-medium border-slate-200 text-slate-700 flex items-center gap-2 hover:bg-slate-50"><i class="fa-solid fa-school text-indigo-400"></i> Colegio</button>
          <button type="button" onclick="selectPlace('Club')" class="place-btn p-3 border rounded-xl text-left font-medium border-slate-200 text-slate-700 flex items-center gap-2 hover:bg-slate-50"><i class="fa-solid fa-futbol text-emerald-400"></i> Club</button>
          <button type="button" onclick="selectPlace('Gimnasio')" class="place-btn p-3 border rounded-xl text-left font-medium border-slate-200 text-slate-700 flex items-center gap-2 hover:bg-slate-50"><i class="fa-solid fa-dumbbell text-amber-400"></i> Gimnasio</button>
          <button type="button" onclick="selectPlace('Casa de amigo')" class="place-btn p-3 border rounded-xl text-left font-medium border-slate-200 text-slate-700 flex items-center gap-2 hover:bg-slate-50"><i class="fa-solid fa-house-user text-purple-400"></i> Amigo/a</button>
        </div>

        <h2 class="text-lg font-bold text-slate-700 mb-3 flex items-center gap-2">
          <i class="fa-regular fa-clock text-blue-500"></i> ¿A qué hora?
        </h2>
        <div class="flex gap-2 mb-3">
          <button type="button" onclick="setTimeQuick(15)" class="time-btn flex-1 py-2 border rounded-xl text-xs font-semibold border-slate-200 hover:bg-slate-50">+15 min</button>
          <button type="button" onclick="setTimeQuick(30)" class="time-btn flex-1 py-2 border rounded-xl text-xs font-semibold border-slate-200 hover:bg-slate-50">+30 min</button>
          <input type="time" id="pickup-time" class="p-2 border rounded-xl text-sm border-slate-200 text-slate-700">
        </div>

        <button onclick="requestPickup()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> Pedir viaje a los papás
        </button>
      </div>

      <!-- Estado de mi viaje actual -->
      <div id="kid-active-trip" class="hidden bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-slate-700 mb-2 border-b pb-2">Estado de tu viaje</h3>
        <p id="kid-trip-status-text" class="text-sm text-indigo-600 font-semibold mb-3">Esperando confirmación...</p>
        <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl flex justify-between items-center">
          <div>
            <p class="text-xs text-amber-800 font-medium">¿Cambió tu horario?</p>
            <p class="text-xs text-amber-600">Avisa para que no esperen de más</p>
          </div>
          <button onclick="modifyTimeModal()" class="px-3 py-1.5 bg-amber-500 text-white text-xs font-bold rounded-lg shadow hover:bg-amber-600">
            Modificar Hora
          </button>
        </div>
      </div>
    </section>

    <!-- VISTA PAPÁS / CHOFERES -->
    <section id="view-mom" class="space-y-4 hidden">
      <!-- Botón para activar sonido y avisos visuales -->
      <button onclick="enableSoundAndNotifications()" id="btn-enable-sound" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-xl shadow flex items-center justify-center gap-2">
        <i class="fa-solid fa-bell"></i> Activar Sonido de Alarma y Notificaciones
      </button>

      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-slate-800">Solicitudes Activas</h2>
        <span id="trip-count" class="bg-indigo-100 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-bold">0 viajes</span>
      </div>

      <div id="mom-trips-list" class="space-y-3">
        <p id="no-trips-msg" class="text-center text-slate-400 py-8 text-sm">No hay viajes pendientes por ahora. ☕</p>
      </div>
    </section>

  </main>

  <script>
    let currentRole = 'kid';
    let selectedKid = 'Felipe';
    let selectedPlace = 'Colegio';
    let audioEnabled = false;

    // Generador de sonido de alarma de alta frecuencia
    function triggerAlarmSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        
        // Tono 1
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc1.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
        gain1.gain.setValueAtTime(0.4, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start();
        osc1.stop(ctx.currentTime + 0.5);

        // Tono 2 (repetido para efecto ruidoso de alarma)
        setTimeout(() => {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, ctx.currentTime);
          osc2.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.15);
          gain2.gain.setValueAtTime(0.4, ctx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start();
          osc2.stop(ctx.currentTime + 0.5);
        }, 200);
      } catch (e) {
        console.log("Audio no activado aún", e);
      }
    }

    function enableSoundAndNotifications() {
      audioEnabled = true;
      triggerAlarmSound();
      
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            alert("¡Alarma y notificaciones activadas con éxito!");
            document.getElementById('btn-enable-sound').classList.add('bg-emerald-600');
            document.getElementById('btn-enable-sound').classList.remove('bg-amber-500');
            document.getElementById('btn-enable-sound').innerHTML = '<i class="fa-solid fa-check"></i> Alarma y Notificaciones Activas';
          }
        });
      } else {
        alert("¡Sonido de alarma activado!");
      }
    }

    function sendSystemNotification(title, body) {
      triggerAlarmSound();
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, { body: body });
      }
    }

    function setRole(role) {
      currentRole = role;
      document.getElementById('view-kid').classList.toggle('hidden', role !== 'kid');
      document.getElementById('view-mom').classList.toggle('hidden', role !== 'mom');
      
      const bKid = document.getElementById('btn-role-kid');
      const bMom = document.getElementById('btn-role-mom');
      if (role === 'kid') {
        bKid.className = "px-3 py-1 rounded-md bg-white text-indigo-700 shadow";
        bMom.className = "px-3 py-1 rounded-md text-indigo-100 hover:text-white";
      } else {
        bMom.className = "px-3 py-1 rounded-md bg-white text-indigo-700 shadow";
        bKid.className = "px-3 py-1 rounded-md text-indigo-100 hover:text-white";
      }
      renderMomView();
    }

    function selectKid(name) {
      selectedKid = name;
      document.querySelectorAll('.kid-btn').forEach(b => {
        const isMatch = b.innerText.trim() === name;
        b.classList.toggle('bg-indigo-100', isMatch);
        b.classList.toggle('border-indigo-500', isMatch);
      });
    }

    function selectPlace(place) {
      selectedPlace = place;
      document.querySelectorAll('.place-btn').forEach(b => {
        const isMatch = b.innerText.includes(place);
        b.classList.toggle('bg-indigo-50', isMatch);
        b.classList.toggle('border-indigo-500', isMatch);
      });
    }

    function setTimeQuick(minutes) {
      const now = new Date();
      now.setMinutes(now.getMinutes() + minutes);
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('pickup-time').value = `${hours}:${mins}`;
    }

    function getTrips() {
      return JSON.parse(localStorage.getItem('ubermom_trips') || '[]');
    }

    function saveTrips(trips, isNewRequest = false, isTimeChange = false) {
      localStorage.setItem('ubermom_trips', JSON.stringify(trips));
      window.dispatchEvent(new Event('storage'));
      
      if (isNewRequest) {
        sendSystemNotification("🚗 ¡Nuevo Viaje Solicitado!", `${selectedKid} pide que lo busquen en ${selectedPlace}`);
      } else if (isTimeChange) {
        sendSystemNotification("⚠️ ¡Cambio de Horario!", `Uno de tus hijos modificó la hora de recogida`);
      }

      renderMomView();
      renderKidView();
    }

    function requestPickup() {
      const timeVal = document.getElementById('pickup-time').value || 'Lo antes posible';
      const trips = getTrips();
      
      const newTrip = {
        id: Date.now(),
        kid: selectedKid,
        place: selectedPlace,
        time: timeVal,
        status: 'Pendiente',
        changed: false,
        timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      };

      trips.unshift(newTrip);
      saveTrips(trips, true, false);
      alert(`¡Viaje de ${selectedKid} solicitado!`);
    }

    function modifyTimeModal() {
      const trips = getTrips();
      if (!trips.length) return;
      const newTime = prompt('Escribe el nuevo horario (ejemplo: 18:30 o +15 min):');
      if (newTime) {
        trips[0].time = newTime;
        trips[0].changed = true;
        saveTrips(trips, false, true);
        alert('Horario actualizado y notificado con alarma a los papás');
      }
    }

    function updateStatus(id, newStatus) {
      const trips = getTrips();
      const trip = trips.find(t => t.id === id);
      if (trip) {
        trip.status = newStatus;
        saveTrips(trips);
      }
    }

    function deleteTrip(id) {
      let trips = getTrips();
      trips = trips.filter(t => t.id !== id);
      saveTrips(trips);
    }

    function renderMomView() {
      const trips = getTrips();
      const container = document.getElementById('mom-trips-list');
      const countEl = document.getElementById('trip-count');
      
      countEl.innerText = `${trips.length} viaje(s)`;

      if (trips.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-8 text-sm">No hay viajes pendientes por ahora. ☕</p>`;
        return;
      }

      container.innerHTML = trips.map(t => `
        <div class="bg-white p-4 rounded-2xl shadow-sm border ${t.changed ? 'time-changed-alert border-amber-400' : 'border-slate-200'} space-y-3">
          ${t.changed ? `<div class="text-xs font-bold text-amber-800 flex items-center gap-1"><i class="fa-solid fa-bell animate-bounce"></i> ¡Horario modificado!</div>` : ''}
          <div class="flex justify-between items-start">
            <div>
              <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full">${t.kid}</span>
              <h4 class="font-bold text-slate-800 text-base mt-2">${t.place}</h4>
            </div>
            <div class="text-right">
              <span class="text-lg font-extrabold text-indigo-600">${t.time}</span>
              <p class="text-xs text-slate-400">Pedida: ${t.timestamp}</p>
            </div>
          </div>
          
          <div class="text-xs font-semibold text-slate-600 bg-slate-50 p-2 rounded-lg">
            Estado: <span class="text-indigo-600 font-bold">${t.status}</span>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="updateStatus(${t.id}, 'Mamá va en camino 🚗')" class="py-1.5 bg-indigo-600 text-white text-xs font-bold rounded-lg shadow hover:bg-indigo-700">Mamá va 🚗</button>
            <button onclick="updateStatus(${t.id}, 'Papá va en camino 🚗')" class="py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg shadow hover:bg-blue-700">Papá va 🚗</button>
            <button onclick="updateStatus(${t.id}, '¡Llegamos afuera! 🔔')" class="py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow hover:bg-emerald-700">¡Llegamos! 🔔</button>
            <button onclick="deleteTrip(${t.id})" class="py-1.5 bg-slate-200 text-slate-700 text-xs font-bold rounded-lg hover:bg-slate-300">Finalizar</button>
          </div>
        </div>
      `).join('');
    }

    function renderKidView() {
      const trips = getTrips();
      const activeTripContainer = document.getElementById('kid-active-trip');
      const statusText = document.getElementById('kid-trip-status-text');

      if (trips.length > 0) {
        activeTripContainer.classList.remove('hidden');
        statusText.innerText = `Lugar: ${trips[0].place} | Horario: ${trips[0].time} | Estado: ${trips[0].status}`;
      } else {
        activeTripContainer.classList.add('hidden');
      }
    }

    window.addEventListener('storage', () => {
      triggerAlarmSound();
      renderMomView();
      renderKidView();
    });

    setTimeQuick(15);
    selectKid('Felipe');
    selectPlace('Colegio');
    renderMomView();
    renderKidView();
  </script>
</body>
</html>
